name: OperationsHome
options:
  bundleIdPrefix: com.operationshome
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
  configs:
    Debug:
      API_BASE_URL: "https://api.homecrm.store/api"
    Release:
      API_BASE_URL: "https://api.homecrm.store/api"
targets:
  OperationsHome:
    type: application
    platform: iOS
    sources:
      - OperationsHome
    info:
      path: OperationsHome/Info.plist
      properties:
        CFBundleDisplayName: 方寸
        APIBaseURL: $(API_BASE_URL)
        CFBundleLocalizations:
          - zh-Hans
        UILaunchScreen: {}
        NSCameraUsageDescription: 用于扫描条形码、二维码，以及拍摄个人头像、空间和物品图片。
        NSPhotoLibraryUsageDescription: 用于从相册选择个人头像、空间和物品图片。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NFCReaderUsageDescription: 用于将储物空间链接写入 NFC 贴纸。
        CFBundleURLTypes:
          - CFBundleURLName: com.operationshome.OperationsHome
            CFBundleURLSchemes:
              - operationshome
    entitlements:
      path: OperationsHome/OperationsHome.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - NDEF
  OperationsHomeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OperationsHomeTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OperationsHome
